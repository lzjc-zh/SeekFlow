name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Verify Gradle wrapper
        run: |
          echo "=== Files ===" && ls -la gradlew gradle/wrapper/
          echo "=== gradlew version ===" && ./gradlew --version || echo "gradlew --version failed: $?"

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log; EXIT_CODE=${PIPESTATUS[0]}
          echo "::group::Last 200 lines of build log"
          tail -200 build.log
          echo "::endgroup::"
          echo "Gradle exit code: $EXIT_CODE"
          exit $EXIT_CODE

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
