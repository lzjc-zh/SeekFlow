name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Debug Info
        run: |
          echo "=== Java ==="
          java -version
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          echo "=== SDK platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "no platforms dir"
          echo "=== Gradle files ==="
          ls -la gradlew gradle/wrapper/
          echo "=== build.gradle.kts (root) ==="
          cat build.gradle.kts
          echo "=== build.gradle.kts (app) ==="
          cat app/build.gradle.kts
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
